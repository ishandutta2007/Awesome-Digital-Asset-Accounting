<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="emerald-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    .grid-line { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    
    /* Animations */
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    
    @keyframes float-shape {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }

    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }

    .animated-orb-1 {
      animation: pulse-glow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }

    .animated-orb-2 {
      animation: pulse-glow 8s ease-in-out infinite 2s;
      transform-origin: 1000px 300px;
    }

    .floating-card {
      animation: float-shape 5s ease-in-out infinite;
      transform-origin: center;
    }

    .flowing-line {
      stroke-dasharray: 8, 8;
      animation: dash-flow 3s linear infinite;
    }

    /* Foreground Typography - Strictly High Contrast & Always Top Z-Index */
    .title-main {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 50px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }

    .title-gradient {
      fill: url(#cyan-purple);
    }

    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }

    .tag-badge {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="1200" height="400" rx="16"/>

  <!-- Background Grid -->
  <g>
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line"/>
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line"/>
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line"/>
    <line x1="0" y1="320" x2="1200" y2="320" class="grid-line"/>
    
    <line x1="200" y1="0" x2="200" y2="400" class="grid-line"/>
    <line x1="400" y1="0" x2="400" y2="400" class="grid-line"/>
    <line x1="600" y1="0" x2="600" y2="400" class="grid-line"/>
    <line x1="800" y1="0" x2="800" y2="400" class="grid-line"/>
    <line x1="1000" y1="0" x2="1000" y2="400" class="grid-line"/>
  </g>

  <!-- Dynamic Animated Orbs in Background -->
  <circle class="animated-orb-1" cx="150" cy="80" r="180" fill="#06b6d4" opacity="0.15" filter="url(#glow)"/>
  <circle class="animated-orb-2" cx="1050" cy="320" r="220" fill="#8b5cf6" opacity="0.18" filter="url(#glow)"/>

  <!-- Background Graphic Elements / Decorative Chart Curves -->
  <g opacity="0.25">
    <!-- Chart line -->
    <path d="M 50 320 Q 250 260, 450 300 T 850 180 T 1150 100" fill="none" stroke="url(#cyan-purple)" stroke-width="4" filter="url(#glow)"/>
    <path d="M 50 320 Q 250 260, 450 300 T 850 180 T 1150 100" fill="none" stroke="#38bdf8" stroke-width="2" class="flowing-line"/>
  </g>

  <!-- Decorative Dynamic Metric Cards (Side Floating Graphics, non-overlapping) -->
  <g class="floating-card" opacity="0.45">
    <rect x="920" y="60" width="220" height="90" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="940" y="95" font-family="sans-serif" font-size="12" fill="#94a3b8">ESTIMATED MARKET</text>
    <text x="940" y="125" font-family="sans-serif" font-weight="bold" font-size="22" fill="#34d399">$2.8B → $8.5B</text>
  </g>

  <g class="floating-card" opacity="0.35" style="animation-delay: 1.5s;">
    <rect x="940" y="180" width="200" height="80" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="960" y="212" font-family="sans-serif" font-size="12" fill="#94a3b8">ERP RECONCILIATION</text>
    <text x="960" y="240" font-family="sans-serif" font-weight="bold" font-size="16" fill="#38bdf8">GAAP / IFRS Ready</text>
  </g>

  <!-- FOREGROUND CONTENT - Guaranteed Foreground Readability -->
  <!-- Tag Pill -->
  <rect x="70" y="65" width="230" height="34" rx="17" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
  <text x="86" y="87" class="tag-badge">⚡ CURATED ECOSYSTEM 2026</text>

  <!-- Main Title -->
  <text x="70" y="165" class="title-main">
    Awesome <tspan class="title-gradient">Digital Asset</tspan> Accounting
  </text>

  <!-- Subtitle -->
  <text x="70" y="215" class="subtitle-text">
    Enterprise Subledgers • Crypto Tax Engines • Cost Basis • Open-Source Trackers
  </text>

  <!-- Feature Highlights Pills -->
  <g transform="translate(70, 260)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="18" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🏢 SaaS Platforms</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="185" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="198" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">💻 Open-Source Repos</text>

    <!-- Pill 3 -->
    <rect x="380" y="0" width="175" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="398" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">📊 Market Analytics</text>
  </g>
</svg>
