<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="emerald-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Glowing Background Orbs -->
  <circle cx="150" cy="80" r="180" fill="#06b6d4" fill-opacity="0.15" filter="url(#glow)"/>
  <circle cx="1050" cy="320" r="220" fill="#8b5cf6" fill-opacity="0.18" filter="url(#glow)"/>

  <!-- Background Graphic Elements / Decorative Chart Curves -->
  <g opacity="0.35">
    <!-- Chart line -->
    <path d="M 50 320 Q 250 260, 450 300 T 850 180 T 1150 100" fill="none" stroke="url(#cyan-purple)" stroke-width="4" filter="url(#glow)"/>
    <path d="M 50 320 Q 250 260, 450 300 T 850 180 T 1150 100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8"/>
  </g>

  <!-- Decorative Metric Cards (Right Side Graphics) -->
  <g opacity="0.85">
    <rect x="910" y="60" width="230" height="90" rx="12" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="930" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">ESTIMATED MARKET</text>
    <text x="930" y="125" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="22" fill="#34d399">$2.8B → $8.5B</text>
  </g>

  <g opacity="0.75">
    <rect x="930" y="180" width="210" height="80" rx="12" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="950" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">ERP RECONCILIATION</text>
    <text x="950" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="16" fill="#38bdf8">GAAP / IFRS Ready</text>
  </g>

  <!-- FOREGROUND CONTENT -->
  <!-- Tag Pill -->
  <rect x="70" y="65" width="230" height="34" rx="17" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
  <text x="86" y="87" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#38bdf8">⚡ CURATED ECOSYSTEM 2026</text>

  <!-- Main Title -->
  <text x="70" y="165" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="48" fill="#ffffff" letter-spacing="-0.5">
    Awesome <tspan fill="url(#cyan-purple)">Digital Asset</tspan> Accounting
  </text>

  <!-- Subtitle -->
  <text x="70" y="215" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="19" fill="#94a3b8">
    Enterprise Subledgers • Crypto Tax Engines • Cost Basis • Open-Source Trackers
  </text>

  <!-- Feature Highlights Pills -->
  <g transform="translate(70, 260)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🏢 SaaS Platforms</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="185" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="198" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">💻 Open-Source Repos</text>

    <!-- Pill 3 -->
    <rect x="380" y="0" width="175" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="398" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">📊 Market Analytics</text>
  </g>
</svg>
